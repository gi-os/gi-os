<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 64" width="420" height="64" role="img" aria-label="Sign the guestbook">
  <style>
    .t { font-family: "VT323", "Courier New", Courier, monospace; font-weight: 700; letter-spacing: 2px; }
    .key { animation: press 2.4s ease-in-out infinite; }
    @keyframes press { 0%,80%,100% { transform: translateY(0); } 88% { transform: translateY(3px); } }
  </style>
  <rect x="4" y="10" width="300" height="44" fill="#0B0B0F" stroke="#00E5FF" stroke-width="2"/>
  <text x="154" y="39" class="t" font-size="20" fill="#00E5FF" text-anchor="middle">SIGN THE GUESTBOOK</text>
  <g class="key">
    <rect x="316" y="14" width="96" height="40" rx="4" fill="#3A3A44"/>
    <rect x="316" y="10" width="96" height="40" rx="4" fill="#E8E8E8" stroke="#3A3A44" stroke-width="2"/>
    <text x="364" y="37" class="t" font-size="18" fill="#0B0B0F" text-anchor="middle">SEND</text>
  </g>
</svg>
